<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="format-detection" content="telephone=no"><meta name="apple-mobile-web-app-capable" content="yes"><style>[hidden]{display:none!important}</style></head><body><title>밤마을</title>
<meta name="theme-color" content="#1c1411">
<meta name="description" content="작은 3D 혼술바 마을에서 미니미와 함께 걸어보세요.">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&family=Jua&display=swap">
<link rel="stylesheet" href="walk.css?v=1791364165">

<div class="app">
  <section class="stage" id="stage" aria-label="미니미가 걷는 3D 바">
    <div id="viewport" tabindex="0" aria-label="바닥을 누르거나 방향키로 미니미를 움직이세요"></div>

    <div class="topbar">
      <div class="brand">
        <span class="moon" aria-hidden="true">☾</span>
        <div><b>밤마을</b><small id="placeLine">성수 · 예시 주민</small></div>
      </div>
      <div class="top-actions">
        <button id="netChip" class="net-chip" hidden aria-label="지금 마을에 있는 팀원"></button>
        <button id="coinButton" class="coin-btn" hidden aria-label="코인 · 상점">🪙 <b id="coinAmount">0</b></button>
        <button id="mapButton">지도</button>
        <button id="exitButton" class="exit-btn" hidden aria-label="나가기">🚪</button>
        <button id="journalButton">MY</button>
      </div>
    </div>

    <button id="bgmBtn" class="bgm-btn" aria-label="배경음악 켜기/끄기">🎵</button>
    <p id="status" class="toast" role="status" aria-live="polite"></p>
    <div id="welcomeBoard" class="welcome-board" hidden></div>
    <div id="tutorial" class="tutorial" hidden></div>
    <div id="worldLabels" class="world-labels"></div>
    <div id="nameplate" class="nameplate" hidden></div>
    <button id="interact" class="interact" hidden></button>

    <div id="joystick" class="joystick" aria-label="조이스틱: 누른 채로 끌어서 걷기"><i class="joy-knob"></i></div>
    <button id="emoteBtn" class="emote-btn" hidden aria-label="표현하기">😊<small>표현</small></button>
    <div id="emotePanel" class="emote-panel" hidden></div>
    <div id="roundCard" class="tutorial round-card" hidden></div>
    <button id="jumpBtn" class="jump-btn" aria-label="점프 (스페이스바)">점프<small>SPACE</small></button>
    <button id="punchBtn" class="punch-btn" aria-label="때리기 (Ctrl)">👊<small>CTRL</small></button>
    <span class="demo-chip">팀 테스트 v1.7</span>

    <div id="fade" class="fade" aria-hidden="true"></div>
    <div id="loading" class="loading"><span>☾</span><p>작은 마을을 여는 중…</p></div>
    <div id="failure" class="failure" hidden>
      <h2>3D 화면을 열지 못했어요</h2>
      <p>브라우저의 3D 지원을 확인하거나 이전 2D 마을을 체험해보세요.</p>
      <a href="social.html">2D 마을 열기</a>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </section>

  <nav id="dock" class="dock" aria-label="빠른 행동"></nav>
</div>

<div id="calm" class="calm" hidden tabindex="-1" role="dialog" aria-label="대화 중 화면">
  <div class="calm-center">
    <span class="calm-moon">☾</span>
    <p class="calm-title">대화 중</p>
    <p class="calm-sub" id="calmTable"></p>
    <p class="calm-hint">폰은 내려놓고 얘기해요. 필요할 때 화면을 눌러요.</p>
  </div>
  <div class="calm-actions">
    <button id="calmMenu">한잔 주문</button>
    <button id="calmHost">호스트 부르기</button>
    <button id="calmNotify" hidden>🔔 알림 켜기</button>
    <button id="calmBack">화면 보기</button>
  </div>
</div>

<dialog id="villageDialog" tabindex="-1">
  <div class="modal-top"><span id="modalLabel"></span><button id="modalClose" aria-label="닫기">×</button></div>
  <div id="modalContent"></div>
</dialog>

<script type="module">
// 실시간 연결 어댑터를 먼저 깐다: 공개 실시간 서버(모두 같은 방) → 안 되면 Claude 자체 실시간.
import('./netshim.mjs?v=1791364165').then(m => { m.install(); }).catch(e => console.warn('online off', e))
.then(() => import('./walk.mjs?v=1791364165')).catch(error => {
  console.error(error);
  document.getElementById('loading').hidden = true;
  document.getElementById('failure').hidden = false;
});
</script>
</body></html>
