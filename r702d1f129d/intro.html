<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>밤마을</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* 입구: 밤골목의 바 정면 한 장. 문을 누르면 열리며 들어간다. 단일 다크 룩 */
  :root { color-scheme: dark; --sky1: #0b0a1a; --sky2: #24132a; --ink: #120a08; --amber: #ffc94a; --warm: #ff9a3c; --neon: #ff6fae; --cream: #fff3dc; --mute: #b8a690;
    --display: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; --body: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; }
  html, body { height: 100%; }
  body { background: radial-gradient(120% 70% at 50% 0%, var(--sky2), var(--sky1) 60%) var(--sky1); color: var(--cream); font-family: var(--body); overflow-x: hidden; }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; padding-inline: 16px; padding-block: 12px 14px; box-sizing: border-box; min-height: 420px; }
  .stars, .moon { position: absolute; pointer-events: none; }
  .stars { inset: 0; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .6; animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .15; } }
  .moon { top: 6%; right: 12%; width: 56px; height: 56px; border-radius: 50%; background: #fff1c9; box-shadow: 0 0 40px 8px rgba(255, 233, 170, .35), 0 0 120px 40px rgba(255, 200, 120, .12); }
  .moon::after { content: ''; position: absolute; inset: -4px 0 0 14px; border-radius: 50%; background: var(--sky1); opacity: .92; }
  .scene { appearance: none; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; color: inherit; font: inherit; transition: transform 1.15s cubic-bezier(.7, 0, .3, 1), opacity .5s 1s; position: relative; display: block; flex: 1 1 auto; min-height: 200px; width: 100%; max-width: 560px; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .neon { animation: flick 6s infinite; }
  @keyframes flick { 0%, 18%, 22%, 61%, 63%, 100% { opacity: 1; } 20%, 62% { opacity: .35; } }
  .glowwin { animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .82; } }
  #doorPanel { transform-box: fill-box; transform-origin: 0% 50%; transition: transform .8s cubic-bezier(.6, 0, .25, 1), filter .8s; }
  #leak, #inside { transition: opacity .6s; }
  .scene:hover #doorPanel, .scene:focus-visible #doorPanel { transform: scaleX(.94); }
  .open #doorPanel { transform: scaleX(.1) !important; filter: brightness(.5); }
  .open #leak { opacity: 1 !important; }
  .scene:focus-visible { outline: none; }
  .scene:focus-visible #frame { stroke: var(--amber); }
  .hint { margin: 0; font: 500 11px/1 var(--mono); letter-spacing: .28em; color: var(--mute); animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .go { display: flex; align-items: center; justify-content: center; width: min(360px, 100%); height: 54px; border-radius: 16px; background: linear-gradient(180deg, #ffd668, #f2b230); color: #2a1a10; font: 700 17px var(--display); letter-spacing: -.01em; text-decoration: none; box-shadow: 0 0 40px rgba(255, 170, 60, .25), inset 0 -3px 0 rgba(120, 70, 10, .35); flex: none; }
  .go:focus-visible, .copy:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px; max-width: 420px; text-align: center; font-size: 12px; color: var(--mute); line-height: 1.5; flex: none; }
  .copy { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255, 201, 74, .35); background: transparent; color: var(--amber); font: 12px var(--body); cursor: pointer; }
  #url { font: 500 11px var(--mono); color: var(--cream); overflow-wrap: anywhere; user-select: all; }
  .go { border: 0; cursor: pointer; }
  /* 빨려 들어가기: 문이 열리고 → 문 쪽으로 확대되며 불빛이 화면을 채운다 → 바 안 */
  .flood { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at var(--fx, 50%) var(--fy, 70%), #fff4d6 0%, #ffc56a 18%, #e0772c 45%, #2a1408 85%); clip-path: circle(0% at var(--fx, 50%) var(--fy, 70%)); z-index: 5; }
  .enter .flood { opacity: 1; clip-path: circle(150% at var(--fx, 50%) var(--fy, 70%)); transition: clip-path .9s cubic-bezier(.7, 0, .3, 1) .45s, opacity .2s .45s; }
  .enter .scene { transform: scale(5.5); }
  .enter .stars, .enter .moon, .enter .hint, .enter #knock { opacity: 0; transition: opacity .4s; }
  .enter #doorPanel { transform: scaleX(.05) !important; filter: brightness(.4); }
  .enter #leak { opacity: 1 !important; }
  /* 바 안(로비): 화면을 꽉 채운 실내 그림 + 메이플식 NPC 대화창 */
  .lobby { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; background: #1a0d07; overflow: hidden; animation: lobbyIn .9s cubic-bezier(.2, .8, .2, 1) both; }
  .lobby[hidden] { display: none; }
  .lobby.leaving { transition: opacity .6s, filter .6s; opacity: 0; filter: brightness(1.8); }
  @keyframes lobbyIn { from { opacity: 0; transform: scale(1.08); filter: brightness(2); } }
  .room { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; max-width: 520px; margin: 0 auto; }
  .lobby { background: radial-gradient(60% 70% at 50% 35%, #4a2512, #1a0d07 75%) #1a0d07; }
  .room svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 4.2s ease-in-out infinite alternate; }
  .sway.s2 { animation-duration: 5.1s; animation-delay: -1.5s; } .sway.s3 { animation-duration: 4.6s; animation-delay: -3s; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .bt { animation: bt 3s ease-in-out infinite; } .bt:nth-child(2n) { animation-delay: -1s; } .bt:nth-child(3n) { animation-delay: -2s; }
  @keyframes bt { 50% { opacity: .55; } }
  .shake { transform-box: fill-box; transform-origin: 50% 100%; animation: shake .32s ease-in-out infinite alternate; }
  @keyframes shake { from { transform: translate(-3px, 2px) rotate(-14deg); } to { transform: translate(3px, -4px) rotate(10deg); } }
  .cheers { transform-box: fill-box; transform-origin: 50% 100%; animation: cheers 2.8s ease-in-out infinite; }
  @keyframes cheers { 0%, 60%, 100% { transform: rotate(0); } 70%, 80% { transform: rotate(-24deg) translateY(-4px); } }
  .pop { transform-box: fill-box; transform-origin: 50% 100%; animation: pop 2.8s ease-in-out infinite; }
  .pop.p2 { animation-delay: -1.4s; }
  @keyframes pop { 0%, 55% { transform: scale(0); opacity: 0; } 65% { transform: scale(1.15); opacity: 1; } 72%, 92% { transform: scale(1); opacity: 1; } 100% { transform: scale(.6); opacity: 0; } }
  .mote { animation: mote 7s linear infinite; } .mote:nth-child(2n) { animation-duration: 9s; animation-delay: -3s; } .mote:nth-child(3n) { animation-duration: 11s; animation-delay: -6s; }
  @keyframes mote { from { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } to { transform: translateY(-160px); opacity: 0; } }
  .ineon { animation: flick 7s infinite; }
  .talk { flex: none; position: relative; margin: 0 auto; width: min(560px, calc(100% - 32px)); margin-bottom: max(16px, env(safe-area-inset-bottom)); display: grid; gap: 12px; }
  .box { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; padding: 16px 16px 18px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(36, 20, 12, .94), rgba(22, 12, 8, .96)); border: 2px solid #c9943a; box-shadow: 0 0 0 4px rgba(20, 10, 6, .8), 0 0 0 5px rgba(201, 148, 58, .35), 0 20px 50px rgba(0, 0, 0, .6); }
  .box::before, .box::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid #f2c46a; transform: rotate(45deg); background: #2a170d; top: -7px; }
  .box::before { left: 18px; } .box::after { right: 18px; }
  .face { width: 64px; height: 64px; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #6b3a20, #2a170d); border: 2px solid #c9943a; overflow: hidden; }
  .who { display: inline-block; margin-bottom: 6px; padding: 3px 9px; border-radius: 6px; background: #c9943a; color: #24140c; font: 800 12px var(--display); letter-spacing: -.01em; }
  .say { margin: 0; min-height: 3.2em; font: 500 15.5px/1.6 var(--body); color: #fff3dc; letter-spacing: -.015em; }
  .say::after { content: '▼'; display: inline-block; margin-left: 6px; font-size: 10px; color: #f2c46a; animation: bob 1s ease-in-out infinite; opacity: var(--more, 0); }
  .go.big { width: 100%; height: 58px; font: 800 18px var(--display); letter-spacing: -.02em; position: relative; overflow: hidden; }
  .go.big::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%); transform: translateX(-120%); animation: sweep 2.6s ease-in-out infinite 1s; }
  @keyframes sweep { 60%, 100% { transform: translateX(120%); } }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--mute); }
  .back { appearance: none; border: 0; background: none; color: var(--mute); font: 600 13px var(--body); cursor: pointer; padding: 6px 0; }
  .back:focus-visible { outline: 2px solid var(--cream); }
  .snd { appearance: none; border: 1px solid rgba(255, 201, 74, .35); background: rgba(0, 0, 0, .35); color: var(--amber); border-radius: 999px; padding: 6px 12px; font: 600 12px var(--body); cursor: pointer; position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; z-index: 2; }
  @media (prefers-reduced-motion: reduce) { .neon, .glowwin, .stars i, .hint, .sway, .bt, .shake, .cheers, .pop, .mote, .ineon, .go.big::after { animation: none; } #doorPanel { transition: none; } }
</style>

        <rect width="400" height="440" fill="url(#wall)"/>

        <rect width="400" height="440" fill="url(#warm)" opacity=".4"/>

    <div class="talk">
      <div class="box"><div class="face" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="38" r="20" fill="#f2a45a"/><path d="M15 26 l3 -16 11 9z M49 26 l-3 -16 -11 9z" fill="#f2a45a"/><circle cx="25" cy="38" r="2.8" fill="#2b2228"/><circle cx="39" cy="38" r="2.8" fill="#2b2228"/><ellipse cx="32" cy="46" rx="6" ry="4" fill="#fbe3c4"/></svg></div>
        <div><span class="who">JAY · 바텐더</span><p class="say" id="say"></p></div></div>
      <button class="go big glow" id="go" type="button">▶ 자리로 가기</button>
      <div class="row"><button class="back" id="back" type="button">← 밖으로</button><span>비밀번호는 초대한 사람에게 물어봐요</span></div>

</div>
<script>
  (function () {
    const s = document.getElementById('stars');
    for (let i = 0; i < 40; i++) { const e = document.createElement('i'); e.style.left = (Math.random() * 100) + '%'; e.style.top = (Math.random() * 45) + '%'; e.style.animationDelay = (Math.random() * 3) + 's'; if (Math.random() < .25) { e.style.width = e.style.height = '3px'; } s.appendChild(e); }
    const wrap = document.getElementById('wrap');
    const LINES = ['어서 와요! 성수 밤마을에 온 걸 환영해요.', '오늘은 재즈가 흐르는 밤이에요. 혼자 왔어도 괜찮아요, 다들 그래요.', '자리 하나 봐뒀어요. 들어가서 편하게 한잔해요.'];
    let tt = 0;
    function typeLines() {
      const el = document.getElementById('say'); let li = 0, ci = 0; clearInterval(tt);
      const tick = () => { const line = LINES[li]; ci++; el.textContent = line.slice(0, ci); el.style.setProperty('--more', '0');
        if (ci >= line.length) { clearInterval(tt); if (li < LINES.length - 1) { el.style.setProperty('--more', '1'); setTimeout(() => { li++; ci = 0; tt = setInterval(tick, 45); }, 1500); } } };
      tt = setInterval(tick, 45);
      el.parentElement.parentElement.onclick = () => { if (ci < LINES[li].length) { ci = LINES[li].length - 1; } };
    }
    // 잔잔한 재즈(직접 합성): 문을 누른 손가락이 소리를 허락해 준다
    const music = (() => {
      let ctx = null, on = false, timer = 0;
      const chords = [[220, 277.2, 329.6, 415.3], [196, 246.9, 293.7, 349.2], [174.6, 220, 261.6, 329.6], [164.8, 207.7, 246.9, 311.1]];
      function note(f, t, d, v, type) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + d + .05); }
      function bar(i) { const t = ctx.currentTime + .05, c = chords[i % 4];
        c.forEach((f, k) => note(f, t + k * .02, 2.2, .035, 'triangle'));
        [0, .5, 1, 1.5].forEach((b, k) => note(c[0] / 2 * (k % 2 ? 1.5 : 1), t + b, .45, .07, 'sine'));
        if (i % 2) note(c[3] * 2, t + 1.25, .5, .025, 'sine'); }
      return { start() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (_) { return; } if (on) return; on = true; let i = 0; bar(i++); timer = setInterval(() => bar(i++), 2000);
          const d = ctx.createOscillator(), g = ctx.createGain(); d.type = 'sawtooth'; d.frequency.setValueAtTime(140, ctx.currentTime); d.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + .5); g.gain.setValueAtTime(.05, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .5); d.connect(g); g.connect(ctx.destination); d.start(); d.stop(ctx.currentTime + .55); },
        stop() { on = false; clearInterval(timer); }, get on() { return on; } };
    })();
    document.getElementById('go').addEventListener('click', () => { music.stop(); clearInterval(tt); document.getElementById('lobby').classList.add('leaving'); try { parent.postMessage({bam: 'intro-done'}, '*'); } catch (_) {} });
    document.getElementById('snd').addEventListener('click', e => { if (music.on) { music.stop(); e.currentTarget.textContent = '♪ 음악 켜기'; } else { music.start(); e.currentTarget.textContent = '♪ 음악 끄기'; } });
    let busy = false;
    const enter = () => {
      if (busy) return; busy = true;
      const d = document.getElementById('doorPanel').getBoundingClientRect(), sc = document.getElementById('scene'), r = sc.getBoundingClientRect();
      const cx = d.left + d.width / 2, cy = d.top + d.height * .55;
      sc.style.transformOrigin = (cx - r.left) + 'px ' + (cy - r.top) + 'px';
      wrap.style.setProperty('--fx', cx + 'px'); wrap.style.setProperty('--fy', cy + 'px');
      wrap.classList.add('open'); try { navigator.vibrate && navigator.vibrate(15); } catch (_) {}
      setTimeout(() => wrap.classList.add('enter'), 380);
      music.start(); setTimeout(() => { const l = document.getElementById('lobby'); l.hidden = false; typeLines(); document.getElementById('go').focus({preventScroll: true}); }, 1550);
    };
    document.getElementById('scene').addEventListener('click', enter);
    document.getElementById('knock').addEventListener('click', enter);
    document.getElementById('back').addEventListener('click', () => { document.getElementById('lobby').hidden = true; music.stop(); clearInterval(tt); wrap.classList.remove('enter', 'open'); busy = false; });
  })();
</script>
